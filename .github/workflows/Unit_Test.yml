name: Build and Run, publish Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create DB .env file
        run: echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
      
      - name: Create API env file
        run: |
          mkdir -p AuthApiBackend
          echo "JWT_KEY=${{ secrets.JWT_KEY }}" > AuthApiBackend/.env
          echo "AES_KEY=${{ secrets.AES_KEY }}" >> AuthApiBackend/.env

      - name: Make .env available to tests
        run: cp AuthApiBackend/.env AuthApiBackendTest/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: AuthApiBackend/Dockerfile
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: authapibackend:latest

      - name: Start docker-compose
        run: docker compose --env-file .env up -d --build

      - name: Wait for services to become healthy
        run: |
          sleep 10
          docker compose ps

      - name: Run .NET tests
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          mkdir -p TestResults
          dotnet test AuthApiBackendTest/AuthApiBackendTest.csproj \
            --verbosity normal \
            --configuration Release \
            --results-directory TestResults \
            --logger "trx;LogFileName=test_results.trx"

      - name: Publish Unit Test results to PR
        uses: EnricoMi/publish-unit-test-results@v2
        if: always()
        with:
          files: "TestResults/**/*.trx"
          check_name: "Unit Test"
          report_individual_runs: true

      - name: Upload TRX as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Stop docker-compose
        if: always()
        run: docker compose down
